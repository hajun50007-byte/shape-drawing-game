name: Deploy Web to GitHub Pages

on:
  push:
    # main 외에 작업 브랜치도 배포한다 — 머지 전에 실기기(iPhone Safari)로
    # 확인하기 위한 프리뷰 용도다. 확인이 끝나면 이 항목은 정리해도 된다.
    branches: [main, claude/bg-effect-combo-fixes]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      - run: flutter build web --release --base-href /shape-drawing-game/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
